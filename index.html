<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">

  <!--APPLE-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="description" content="Aplicativo PWA para gerenciamento de patrimônio">
  <title>Loja</title>

  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="stylesheet" href="./styles.css?v=1">
  <link rel="manifest" href="./manifest.json">

  <script src="./app.js?v=1" type="module"></script>
</head>

<body>
  <header class="header">
    <img src="./icon.png" alt="logo do site" class="img-header">
    <h1>TecnoLojia
      <button id="installBtn" class="btn install-btn" hidden>Instalar</button>
    </h1>
  </header>

  <div class="container">
    <section class="section" id="botaoNovoPatrimonioSection">
      <button class="btn btn-large btn-success" onclick="toggleFormSection()">Novo Produto</button>
    </section>
    <section class="section" id="formSection">
      <h2>Novo Produto</h2>
      <form action="" id="patrimonioForm">
        <div class="form-group">
          <label for="nomeProduto">Nome</label>
          <input type="text" id="nomeProduto" placeholder="Digite o nome do produto" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="imagem">Imagem</label>
          <input id="imagem" type="text" placeholder="https://flaticon.com/image"></input>
        </div>
        <div class="form-group">
          <label for="precoProduto">Preço</label>
          <input type="number" id="precoProduto" placeholder="R$00,00" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Descreva a tecnologia" required autocomplete="off">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Salvar</button>
          <button class="btn btn-secondary" type="button" onclick="toggleFormSection()">Cancelar</button>
        </div>
      </form>
    </section>
    <section class="section" id="tabelaSection">
      <h2>Lista de Patrimônios</h2>
      <div id="patrimonioList" class="patrimonio-list">
        <p class="empty-message">Nenhum patrimônio registrado</p>
      </div>
    </section>
  </div>
  <footer class="footer">
    <p>Controle de Patrimônio</p>
  </footer>
</body>

</html>
